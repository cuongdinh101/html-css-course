<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Interactive Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Interactive Photo Gallery</h1>

    <div id="image">
        Hover over an image below to display here.
    </div>

    <img class="preview"
         src="https://picsum.photos/id/1015/300/200"
         alt="Beautiful lake"
         onmouseover="upDate(this)"
         onmouseout="unDo()">

    <img class="preview"
         src="https://picsum.photos/id/1018/300/200"
         alt="Mountain view"
         onmouseover="upDate(this)"
         onmouseout="unDo()">

    <img class="preview"
         src="https://picsum.photos/id/103/300/200"
         alt="Forest road"
         onmouseover="upDate(this)"
         onmouseout="unDo()">

    <script src="script.js"></script>
</body>
</html>
